<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header>
            <div class="container">
                <img src="images/logo.png" id="logo-img" alt="oldagram logo">
                <img src="images/Photo.jpeg" class="user-imgs" alt="user image">
        </header>
        <main id="main-el">
            <section>
                <div class="container-acct">
                    <img src="images/avatar-vangogh.jpg" class="user-imgs">
                    <p class="name-loca"><span class="bold-text">Vincent van Gogh</span><br>Zundert, Netherlands</p>
                </div>
                <img src="images/post-vangogh.jpg" class="post-img">
                <div class="container-3">
                    <div>
                        <button class="btn" id="like-btn"><img src="images/icon-heart.png" alt="a heart symbolising like button"></button>
                        <button class="btn"><img src="images/icon-comment.png" alt="a chat box symbolising comment section"></button>
                        <button class="btn"><img src="images/icon-dm.png" alt="a paper plane symbolising DM"></button>
                    </div>
                    <div>
                        <p class="bold-text"><span class="like-count">21,492</span> likes</p>
                    </div>
                    <div>
                        <p><span class="bold-text">vincey1853</span> just took a few mushrooms lol</p>
                    </div>
                </div>
            </section>
        </main>
        <script src="index.js"></script>
    </body>
</html>
